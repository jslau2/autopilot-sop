<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Autopilot S&amp;OP</title>
  <script>
    // Redirect SPA routes to index.html, encoding the path as a query param.
    // pathSegmentsToKeep = 1 because the site lives at /autopilot-sop/
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + 1).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
</html>
