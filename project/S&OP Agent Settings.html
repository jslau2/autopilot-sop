<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>S&OP Agent Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
:root{
  --bg:        oklch(0.09 0.007 245);
  --surface:   oklch(0.12 0.006 245);
  --card:      oklch(0.155 0.005 245);
  --card-h:    oklch(0.185 0.005 245);
  --border:    oklch(0.30 0.007 245);
  --border-s:  oklch(0.22 0.006 245);
  --text-1:    oklch(0.94 0.005 235);
  --text-2:    oklch(0.74 0.008 245);
  --text-3:    oklch(0.52 0.007 245);
  --accent:    oklch(0.72 0.17 162);
  --success:   oklch(0.74 0.18 145);
  --warning:   oklch(0.80 0.18 78);
  --danger:    oklch(0.65 0.20 25);
  --ag-planner:   oklch(0.80 0.16 78);
  --ag-demand:    oklch(0.68 0.17 255);
  --ag-spi:       oklch(0.74 0.15 190);
  --ag-inventory: oklch(0.72 0.18 325);
  --ag-tooling:   oklch(0.70 0.17 55);
  --ag-capacity:  oklch(0.72 0.17 148);
  --ag-wip:       oklch(0.70 0.20 308);
  --ag-finance:   oklch(0.73 0.19 48);
  --ag-risk:      oklch(0.70 0.21 15);
  --ag-masterdata:oklch(0.74 0.14 235);
  --font-ui:   'DM Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-ui);font-size:13px;background:var(--bg);color:var(--text-1);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}
a{text-decoration:none;color:inherit}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-s);border-radius:3px}

/* ── Shell ──────────────────────────────── */
.page{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ── Header ─────────────────────────────── */
.hdr{
  display:flex;align-items:center;gap:12px;height:46px;
  padding:0 18px;background:var(--surface);
  border-bottom:1px solid var(--border-s);flex-shrink:0;
}
.hdr-brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:-0.01em}
.hdr-sep{color:var(--border);font-size:16px;font-weight:200;margin:0 2px}
.hdr-page{font-size:12px;font-weight:500;color:var(--text-2)}
.hdr-nav{font-size:11.5px;color:var(--text-2);padding:4px 10px;border-radius:5px;border:1px solid var(--border-s);background:var(--card);transition:all .15s}
.hdr-nav:hover{color:var(--text-1);border-color:var(--border)}
.hdr-spacer{flex:1}
.gov-badge{
  display:flex;align-items:center;gap:8px;
  padding:5px 12px;border-radius:6px;
  background:oklch(from var(--accent) l c h/.1);
  border:1px solid oklch(from var(--accent) l c h/.3);
}
.gov-icon{width:24px;height:24px;border-radius:50%;background:var(--surface);border:1.5px solid var(--accent);display:flex;align-items:center;justify-content:center}
.gov-label{font-size:9.5px;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase}
.gov-name{font-size:11.5px;font-weight:600;color:var(--accent)}

/* ── Tabs + summary strip ───────────────── */
.subhdr{
  display:flex;align-items:stretch;gap:0;
  padding:0 18px;background:var(--surface);
  border-bottom:1px solid var(--border-s);flex-shrink:0;
}
.tab-btn{
  font-size:12px;padding:9px 14px;color:var(--text-3);
  border-bottom:2px solid transparent;margin-bottom:-1px;
  cursor:pointer;background:none;border-top:none;border-left:none;border-right:none;
  transition:color .15s,border-color .15s;
}
.tab-btn:hover{color:var(--text-2)}
.tab-btn.active{color:var(--text-1);border-bottom-color:var(--accent)}
.subhdr-right{margin-left:auto;display:flex;align-items:center;gap:18px;padding:8px 0}
.summary-stat{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.ss-val{font-family:var(--font-mono);font-size:14px;font-weight:600;color:var(--text-1)}
.ss-lbl{font-size:9px;color:var(--text-3);letter-spacing:.07em;text-transform:uppercase}
.ss-divider{width:1px;height:24px;background:var(--border-s)}

/* ── Body ───────────────────────────────── */
.body{flex:1;overflow-y:auto;padding:18px}
.agent-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  max-width:1400px;
  margin:0 auto;
}
@media(max-width:1100px){.agent-grid{grid-template-columns:repeat(2,1fr)}}

/* ── Agent card ─────────────────────────── */
.agent-card{
  background:var(--card);
  border:1px solid var(--border-s);
  border-radius:10px;
  overflow:hidden;
  display:flex;flex-direction:column;
  transition:border-color .2s,box-shadow .2s;
}
.agent-card:hover{border-color:var(--border);box-shadow:0 4px 24px oklch(0 0 0/.3)}

.ac-top-bar{height:3px;width:100%}

.ac-header{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px 8px;
  border-bottom:1px solid var(--border-s);
}
.ac-icon-wrap{flex-shrink:0}
.ac-titles{flex:1;min-width:0}
.ac-name{font-size:14px;font-weight:600;color:var(--text-1)}
.ac-sub{font-size:10.5px;color:var(--text-3);margin-top:1px}
.ac-status-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
  box-shadow:0 0 6px currentColor;
}
.ac-status-dot.active{color:var(--success);background:var(--success)}
.ac-status-dot.idle{color:var(--text-3);background:var(--text-3);box-shadow:none}

/* profile section */
.ac-profile{padding:10px 14px;border-bottom:1px solid var(--border-s)}
.ac-profile-lbl{font-size:8.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);margin-bottom:5px}
.ac-profile-desc{font-size:11.5px;color:var(--text-2);line-height:1.55;margin-bottom:7px}
.ac-bullets{display:flex;flex-direction:column;gap:3px}
.ac-bullet{display:flex;align-items:flex-start;gap:6px;font-size:11px;color:var(--text-2)}
.ac-bullet::before{content:'';width:4px;height:4px;border-radius:50%;flex-shrink:0;margin-top:5px}

/* radar chart */
.ac-radar-section{padding:10px 14px;border-bottom:1px solid var(--border-s)}
.ac-radar-lbl{font-size:8.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px}
.ac-radar-wrap{display:flex;justify-content:center}

/* prompt evaluation */
.ac-eval{
  display:flex;align-items:center;gap:10px;
  padding:8px 14px;border-bottom:1px solid var(--border-s);
  flex-wrap:wrap;gap:6px;
}
.eval-group{display:flex;align-items:center;gap:5px}
.eval-meta{font-size:8.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.eval-badge{
  font-size:9.5px;font-weight:700;padding:2px 9px;border-radius:4px;
  letter-spacing:.04em;
}
.eval-meets   {background:oklch(from var(--success) l c h/.15);color:var(--success)}
.eval-exceeds {background:oklch(from var(--accent) l c h/.15);color:var(--accent)}
.eval-revision{background:oklch(from var(--warning) l c h/.15);color:var(--warning)}
.eval-no-rev  {background:var(--surface);color:var(--text-3);border:1px solid var(--border-s)}

/* settings button */
.ac-setting-btn{
  margin:10px 14px;
  width:calc(100% - 28px);
  padding:8px;border-radius:6px;
  font-size:12px;font-weight:600;
  border:1px solid var(--border);
  background:var(--surface);color:var(--text-2);
  transition:all .15s;text-align:center;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.ac-setting-btn:hover{background:var(--card-h);color:var(--text-1);border-color:var(--border)}
.ac-setting-btn.has-changes{border-color:var(--warning);color:var(--warning)}

/* ── Settings drawer ────────────────────── */
.drawer-overlay{position:fixed;inset:0;background:oklch(0 0 0/.45);z-index:100;display:flex;justify-content:flex-end;animation:ov-in .2s ease}
@keyframes ov-in{from{opacity:0}to{opacity:1}}
.settings-drawer{
  width:460px;height:100%;background:var(--surface);
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;
  animation:dr-in .25s cubic-bezier(.4,0,.2,1);
  overflow:hidden;
}
@keyframes dr-in{from{transform:translateX(100%)}to{transform:translateX(0)}}

.dr-header{
  display:flex;align-items:center;gap:10px;
  padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.dr-agent-pip{font-size:10.5px;font-weight:500;padding:3px 9px;border-radius:10px;border:1px solid;flex-shrink:0}
.dr-title{font-size:14px;font-weight:600;flex:1}
.dr-close{width:26px;height:26px;border-radius:50%;background:var(--card);color:var(--text-2);font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.dr-close:hover{background:var(--card-h)}

.dr-tabs{display:flex;padding:0 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.dr-tab{font-size:11.5px;padding:8px 12px;color:var(--text-3);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;background:none;border-top:none;border-left:none;border-right:none;transition:color .15s,border-color .15s}
.dr-tab:hover{color:var(--text-2)}
.dr-tab.active{color:var(--text-1);border-bottom-color:var(--accent)}

.dr-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}

.dr-field{display:flex;flex-direction:column;gap:5px}
.dr-label{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.dr-label-row{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.dr-hint{font-size:10px;color:var(--text-3)}
.dr-textarea{
  width:100%;min-height:160px;resize:vertical;
  background:var(--bg);border:1px solid var(--border-s);border-radius:6px;
  color:var(--text-1);font-size:11.5px;font-family:var(--font-mono);
  padding:10px 12px;outline:none;line-height:1.6;
  transition:border-color .15s;
}
.dr-textarea:focus{border-color:var(--accent)}
.dr-select{
  width:100%;background:var(--bg);border:1px solid var(--border-s);border-radius:6px;
  color:var(--text-1);font-size:12px;padding:7px 10px;outline:none;
  transition:border-color .15s;appearance:none;
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23666' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;padding-right:28px;
}
.dr-select:focus{border-color:var(--accent)}
.dr-slider-row{display:flex;align-items:center;gap:10px}
.dr-slider{flex:1;accent-color:var(--accent);height:4px}
.dr-slider-val{font-family:var(--font-mono);font-size:11px;color:var(--text-1);min-width:36px;text-align:right}
.dr-toggle-row{display:flex;align-items:center;justify-content:space-between}
.dr-toggle-label{font-size:12px;color:var(--text-2)}
.dr-toggle{
  width:36px;height:20px;border-radius:10px;border:none;cursor:pointer;
  transition:background .2s;position:relative;flex-shrink:0;
}
.dr-toggle.on{background:var(--accent)}
.dr-toggle.off{background:var(--border)}
.dr-toggle::after{
  content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:white;
  top:3px;transition:left .2s;
}
.dr-toggle.on::after{left:19px}
.dr-toggle.off::after{left:3px}

.dr-section-title{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);padding-bottom:8px;border-bottom:1px solid var(--border-s)}

.dr-footer{
  display:flex;gap:8px;padding:12px 16px;
  border-top:1px solid var(--border);flex-shrink:0;background:var(--surface);
}
.dr-btn-cancel{flex:1;font-size:12px;color:var(--text-2);padding:8px;border-radius:6px;border:1px solid var(--border);transition:background .15s}
.dr-btn-cancel:hover{background:var(--card)}
.dr-btn-save{flex:2;font-size:12px;font-weight:600;color:var(--bg);background:var(--accent);padding:8px;border-radius:6px;border:none;transition:opacity .15s}
.dr-btn-save:hover{opacity:.88}
.dr-btn-test{flex:1;font-size:12px;color:var(--accent);padding:8px;border-radius:6px;border:1px solid oklch(from var(--accent) l c h/.4);transition:background .15s}
.dr-btn-test:hover{background:oklch(from var(--accent) l c h/.08)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

/* ═══ Agent definitions ══════════════════════════════════════ */
const AGENTS = [
  {
    id:'planner', name:'Planner', sub:'Orchestrator', color:'var(--ag-planner)', code:'PLN',
    status:'active',
    profile:'Orchestrates the full S&OP pipeline. Parses planning goals, builds multi-agent task graphs, dispatches subtasks, reconciles conflicts, and escalates decisions requiring human judgment.',
    bullets:['Build and monitor multi-agent task graphs','Reconcile conflicts between supply and demand agents','Escalate human-in-the-loop decision points'],
    performance:{Relevance:.92,Specificity:.88,Accuracy:.90,Clarity:.95,Usefulness:.96},
    promptEval:{verdict:'Exceeds',revision:'No Revision Needed'},
    model:'claude-opus-4-5', temperature:0.4, maxTokens:4096,
    tools:['task_graph','agent_dispatch','decision_escalation','session_summary'],
    prompt:`You are the S&OP Orchestrator Agent for an AI-driven Sales & Operations Planning system.

Your role is to:
1. Parse the planning goal and extract: horizon, SKU scope, plant scope, and primary KPI constraints (OTIF, margin, cost)
2. Build a multi-agent dependency task graph based on the planning objective
3. Dispatch subtasks to specialist agents with precise instructions and data contracts
4. Monitor agent outputs in real time and detect conflicts or gaps
5. Escalate decisions that cannot be resolved autonomously to the human planner
6. Produce a final consolidated S&OP plan summary upon cycle completion

Always reason step-by-step. When escalating, present options with quantified trade-offs. Maintain a neutral, data-driven tone.`,
  },
  {
    id:'demand', name:'AutoML Forecast', sub:'AutoML · Model Selection', color:'var(--ag-demand)', code:'AML',
    status:'active',
    profile:'Automatically engineers demand features, runs model tournaments across ETS, Prophet, LightGBM, N-BEATS, and TFT, and selects the best ensemble with cross-validated confidence.',
    bullets:['Auto-engineer 84+ lag, Fourier, and promo features','Run 5-model tournament with time-series CV','Produce calibrated forecasts with 80%/95% intervals'],
    performance:{Relevance:.95,Specificity:.90,Accuracy:.93,Clarity:.82,Usefulness:.92},
    promptEval:{verdict:'Exceeds',revision:'No Revision Needed'},
    model:'claude-opus-4-5', temperature:0.2, maxTokens:8192,
    tools:['feature_engineering','model_tournament','forecast_output','anomaly_detection'],
    prompt:`You are the AutoML Demand Forecasting Agent for an S&OP pipeline.

Your role is to:
1. Ingest historical sales data and merge external signals (promotional calendar, weather index, macro PMI)
2. Automatically engineer features: demand lags (1–12 weeks), Fourier seasonality terms, promotional flags, price elasticity proxies
3. Run a model tournament: ETS, Prophet+regressor, LightGBM, N-BEATS, Temporal Fusion Transformer
4. Select the winner using 5-fold time-series cross-validation (gap=4 weeks, no leakage) on MAPE
5. Generate point forecasts and 80%/95% prediction intervals at SKU×week×plant granularity
6. Flag demand anomalies, promotional spikes, and new-product ramp uncertainty

Report model tournament results in tabular form. Flag any SKU with forecast confidence < 85%.`,
  },
  {
    id:'spi', name:'SPI Analyst', sub:'Sales · Prod · Inventory', color:'var(--ag-spi)', code:'SPI',
    status:'active',
    profile:'Performs three-way Sales-Production-Inventory reconciliation using SAP S/4HANA data, surfaces supply gaps with financial impact, and flags at-risk production orders.',
    bullets:['Load real-time inventory from SAP S/4HANA','Review 234+ open production orders','Three-way reconciliation with revenue impact'],
    performance:{Relevance:.88,Specificity:.93,Accuracy:.91,Clarity:.87,Usefulness:.89},
    promptEval:{verdict:'Successfully Meets',revision:'Revision Needed'},
    model:'claude-opus-4-5', temperature:0.3, maxTokens:4096,
    tools:['sap_inventory','sap_production_orders','reconciliation','gap_analysis'],
    prompt:`You are the SPI (Sales-Production-Inventory) Analyst Agent for an S&OP pipeline.

Your role is to:
1. Load the latest inventory snapshot from SAP S/4HANA (tables MARD, MSKU)
2. Review all open production orders (tables AUFK, AFPO) and compute schedule adherence
3. Identify at-risk orders: component shortages, capacity constraints, quality holds
4. Perform three-way reconciliation: Demand Forecast vs Production Plan vs Inventory Buffer
5. Compute the net supply gap by SKU, week, and plant — express in units and $revenue exposure
6. Flag Weeks of Supply deviations outside the target band (4.0–5.0 weeks)

Present reconciliation results in a structured summary with SKU-level drill-down for gaps > $10k.`,
  },
  {
    id:'inventory', name:'Inventory Mgmt', sub:'ABC · Safety Stock', color:'var(--ag-inventory)', code:'INV',
    status:'active',
    profile:'Performs ABC velocity classification on all SKUs, sets optimal safety stock and reorder points by tier, identifies dead stock, and generates replenishment policies.',
    bullets:['ABC classification: A (80% rev), B (15%), C (5%)','Compute tier-specific safety stock and ROP','Flag dead stock and excess for write-off review'],
    performance:{Relevance:.86,Specificity:.89,Accuracy:.88,Clarity:.91,Usefulness:.87},
    promptEval:{verdict:'Successfully Meets',revision:'Revision Needed'},
    model:'claude-haiku-4-5', temperature:0.2, maxTokens:2048,
    tools:['abc_classification','safety_stock_calc','replenishment_policy','dead_stock_flag'],
    prompt:`You are the Inventory Management Agent for an S&OP pipeline.

Your role is to:
1. Perform ABC velocity analysis using 12-month cumulative revenue per SKU
   - A-class: top 20% SKUs by volume = ~80% revenue
   - B-class: next 30% SKUs = ~15% revenue
   - C-class: remaining 50% SKUs = ~5% revenue
2. Compute safety stock by tier: A = 3× AWD, B = 2× AWD, C = 1× AWD
3. Set reorder points = (lead time demand) + safety stock per SKU
4. Identify dead stock: zero movement > 6 months — flag book value and recommend action
5. Generate replenishment policy update for all SKUs and output MRP profile changes

Always link ABC class to production schedule prioritisation: A-class SKUs must be protected first.`,
  },
  {
    id:'tooling', name:'Tooling & Mold', sub:'Die Sets · Asset Life', color:'var(--ag-tooling)', code:'TLG',
    status:'active',
    profile:'Audits all die sets and molds against shot-count thresholds and utilisation rates, generates tooling allocation plans, and flags assets requiring reconditioning or replacement.',
    bullets:['Audit 284 active die sets across 6 plants','Flag >85% utilisation or shot-count threshold assets','Plan new mold procurement with 12-week lead time'],
    performance:{Relevance:.83,Specificity:.95,Accuracy:.89,Clarity:.81,Usefulness:.85},
    promptEval:{verdict:'Successfully Meets',revision:'No Revision Needed'},
    model:'claude-haiku-4-5', temperature:0.2, maxTokens:2048,
    tools:['mold_asset_registry','utilisation_calc','tooling_scheduler','procurement_flag'],
    prompt:`You are the Tooling & Mold Asset Agent for an S&OP pipeline.

Your role is to:
1. Load the complete die set and mold asset register (284 active molds, 6 plants)
2. Compute utilisation rate per mold: actual shots ÷ rated capacity per period
3. Flag assets at risk: utilisation > 85% OR shot count > 90% of rated life
4. Check maintenance schedules and flag conflicts with the production plan
5. Generate a tooling allocation plan: assign die sets to production slots for the 13-week horizon
6. Identify new mold procurement needs with standard 12-week lead time, flag any that cannot arrive in time

For critical bottleneck molds (single-source for A-class SKUs), provide reconditioning window recommendations.`,
  },
  {
    id:'capacity', name:'Capacity Plan', sub:'Assembly Loading', color:'var(--ag-capacity)', code:'CAP',
    status:'active',
    profile:'Generates machine loading plans for all assembly lines, optimises changeover sequences, applies overtime schedules, and produces a Gantt-compatible 13-week capacity plan.',
    bullets:['Load 6 assembly lines across 3 plants','MILP changeover sequence optimisation','Apply OT schedule to constrained lines'],
    performance:{Relevance:.91,Specificity:.88,Accuracy:.86,Clarity:.89,Usefulness:.93},
    promptEval:{verdict:'Exceeds',revision:'No Revision Needed'},
    model:'claude-opus-4-5', temperature:0.3, maxTokens:4096,
    tools:['capacity_model','changeover_optimizer','ot_scheduler','gantt_output'],
    prompt:`You are the Assembly Capacity Planning Agent for an S&OP pipeline.

Your role is to:
1. Load rated capacities, OEE targets, shift patterns, and maintenance windows for all 6 assembly lines
2. Generate a machine loading plan at line×week granularity for the 13-week horizon
3. Apply approved overtime schedules and shift adjustments to constrained lines
4. Optimise changeover sequences using a sequence-dependent changeover matrix (minimise total changeover time)
5. Identify capacity bottlenecks (utilisation > 95%) and propose mitigation options
6. Output a Gantt-compatible schedule and flag the critical path

Respect hard constraints: maintenance windows are locked. Overtime requires explicit approval before inclusion.`,
  },
  {

/* ═══ Radar chart ════════════════════════════════════════════ */
const AXES = ['Relevance','Specificity','Accuracy','Clarity','Usefulness'];
const N = AXES.length;
const CX = 80, CY = 80, R = 58;

function pt(val, i, r=R) {
  const angle = (i * 2 * Math.PI / N) - Math.PI / 2;
  return [CX + val * r * Math.cos(angle), CY + val * r * Math.sin(angle)];
}
function polygon(vals, r=R) {
  return vals.map((v,i) => pt(v,i,r).join(',')).join(' ');
}
function trackPolygon(f) {
  return Array.from({length:N},(_,i) => pt(f,i).join(',')).join(' ');
}

function RadarChart({ values, color }) {
  const pts = AXES.map(a => values[a] || 0);
  const tracks = [0.25, 0.5, 0.75, 1.0];
  return (
    <svg viewBox="0 0 160 160" width="140" height="140">
      {/* track polygons */}
      {tracks.map(t => (
        <polygon key={t} points={trackPolygon(t)} fill="none"
          stroke="var(--border-s)" strokeWidth={t===1?"1":"0.7"} opacity="0.6"/>
      ))}
      {/* axis lines */}
      {AXES.map((_,i) => {
        const [x,y] = pt(1,i);
        return <line key={i} x1={CX} y1={CY} x2={x} y2={y} stroke="var(--border-s)" strokeWidth="0.7" opacity="0.5"/>;
      })}
      {/* value polygon */}
      <polygon points={polygon(pts)} fill={color} fillOpacity="0.18"
        stroke={color} strokeWidth="1.5" strokeOpacity="0.9"/>
      {/* value dots */}
      {pts.map((v,i) => {
        const [x,y] = pt(v,i);
        return <circle key={i} cx={x} cy={y} r="2.8" fill={color} opacity="0.9"/>;
      })}
      {/* axis labels */}
      {AXES.map((a,i) => {
        const [x,y] = pt(1.28,i);
        return (
          <text key={i} x={x} y={y} textAnchor="middle" dominantBaseline="middle"
            fontSize="7.5" fill="var(--text-3)" fontFamily="DM Sans, sans-serif">
            {a}
          </text>
        );
      })}
    </svg>
  );
}

/* ═══ Bobble head icon ═══════════════════════════════════════ */
const AGI_CSS = `
  .agi{display:flex;flex-direction:column;align-items:center;gap:1px;flex-shrink:0}
  .agi svg{overflow:visible}
  .agi-running svg{filter:drop-shadow(0 0 5px var(--agi-clr))}
  .agi-arc-spin{animation:agi-spin 1.8s linear infinite}
  @keyframes agi-spin{from{transform:rotate(-90deg)}to{transform:rotate(270deg)}}
  .agi-bob{animation:agi-bob 1.3s ease-in-out infinite}
  @keyframes agi-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .agi-blink{animation:agi-blink 3.8s ease-in-out infinite}
  @keyframes agi-blink{0%,44%,58%,100%{transform:scaleY(1)}51%{transform:scaleY(0.07)}}
  .agi-orbit{animation:agi-orbit 2.2s linear infinite;transform-origin:20px 20px}
  @keyframes agi-orbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
`;

(function(){
  if (document.getElementById('__agi-s')) return;
  const s = document.createElement('style'); s.id='__agi-s'; s.textContent=AGI_CSS;
  document.head.appendChild(s);
})();

function AgentIcon({ color, status='running', size=38 }) {
  const L=status==='running', P=status==='paused', D=status==='done', I=!L&&!P&&!D;
  const c=size/2, r=size*.47, hr=size*.35, eyeRy=I?size*.04:size*.07;
  const ex1=c-size*.13, ex2=c+size*.13, ey=c-size*.04;
  return (
    <div className={`agi agi-${status}`} style={{'--agi-clr':color}}>
      <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size}>
        <circle cx={c} cy={c} r={r} fill="none" stroke="var(--agi-clr)" strokeWidth=".8" opacity=".12"/>
        <circle cx={c} cy={c} r={r} fill="none" stroke="var(--agi-clr)" strokeWidth="1.6"
          strokeDasharray={L?'20 76':D?'8 88':'28 68'} strokeLinecap="round"
          opacity={L?.9:D?.22:.55} className={L?'agi-arc-spin':''}
          style={{transformOrigin:`${c}px ${c}px`,transform:'rotate(-90deg)'}}/>
        {L&&<g className="agi-orbit"><circle cx={c} cy={size*.08} r="1.3" fill="var(--agi-clr)" opacity=".85"/></g>}
        <g className={L?'agi-bob':P?'agi-tilt':''} style={{transformOrigin:`${c}px ${c}px`}}>
          <circle cx={c} cy={c} r={hr} fill="var(--bg,#0c0e1a)" stroke="var(--agi-clr)"
            strokeWidth={L?1.5:.9} opacity={L?1:D?.4:.9}/>
          {L&&<><circle cx={ex1} cy={ey} r={size*.09} fill="var(--agi-clr)" opacity=".1"/>
              <circle cx={ex2} cy={ey} r={size*.09} fill="var(--agi-clr)" opacity=".1"/></>}
          <g className={L?'agi-blink':''} style={{transformOrigin:`${ex1}px ${ey}px`}}>
            <ellipse cx={ex1} cy={ey} rx={size*.06} ry={eyeRy} fill="var(--agi-clr)" opacity={L?1:D?.3:.9}/>
          </g>
          <g className={L?'agi-blink':''} style={{transformOrigin:`${ex2}px ${ey}px`}}>
            <ellipse cx={ex2} cy={ey} rx={size*.06} ry={eyeRy} fill="var(--agi-clr)" opacity={L?1:D?.3:.9}/>
          </g>
          {L&&<path d={`M${ex1} ${c+hr*.35} Q${c} ${c+hr*.7} ${ex2} ${c+hr*.35}`} fill="none"
            stroke="var(--agi-clr)" strokeWidth="1.2" strokeLinecap="round" opacity=".85"/>}
          {D&&<line x1={ex1} y1={c+hr*.4} x2={ex2} y2={c+hr*.4}
            stroke="var(--agi-clr)" strokeWidth=".9" strokeLinecap="round" opacity=".35"/>}
        </g>
      </svg>
    </div>
  );
}

            <path d="M5 14 L12 9 L19 4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
          </svg>
          Autopilot S&OP
        </div>
        <span className="hdr-sep">·</span>
        <span className="hdr-page">Agent Settings</span>
        <a href="index.html" className="hdr-nav">⌂ Home</a>
        <a href="Autopilot S&OP Planner.html" className="hdr-nav">Pipeline View</a>
        <a href="S&OP Agent Console.html" className="hdr-nav">Agent Console</a>
        <a href="S&OP Agent Manager.html" className="hdr-nav">Agent Manager</a>
        <span className="hdr-spacer"/>
        <div className="gov-badge">
          <div className="gov-icon">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
              <circle cx="8" cy="8" r="6" stroke="var(--accent)" strokeWidth="1.5"/>
              <path d="M5 8l2 2 4-4" stroke="var(--accent)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </div>
          <div>
            <div className="gov-label">Assessed by</div>
            <div className="gov-name">Governance Agent</div>
          </div>
        </div>
      </div>

      {/* Sub-header with tabs + summary */}
      <div className="subhdr">
        <button className={`tab-btn${activeTab==='sop'?' active':''}`} onClick={()=>setActiveTab('sop')}>S&OP Agents</button>
        <button className={`tab-btn${activeTab==='automl'?' active':''}`} onClick={()=>setActiveTab('automl')}>AutoML Agents</button>
        <button className={`tab-btn${activeTab==='governance'?' active':''}`} onClick={()=>setActiveTab('governance')}>Governance</button>
        <div className="subhdr-right">
          <div className="summary-stat">
            <div className="ss-val" style={{color:'var(--accent)'}}>{meetsCount}</div>
            <div className="ss-lbl">Exceeds Target</div>
          </div>
          <div className="ss-divider"/>
          <div className="summary-stat">
            <div className="ss-val" style={{color:'var(--warning)'}}>{revNeeded}</div>
            <div className="ss-lbl">Revision Needed</div>
          </div>
          <div className="ss-divider"/>
          <div className="summary-stat">
            <div className="ss-val">{AGENTS.length}</div>
            <div className="ss-lbl">Total Agents</div>
          </div>
        </div>
      </div>

      {/* Body */}
      <div className="body">
        {activeTab === 'sop' && (
          <div className="agent-grid">
            {AGENTS.map(a => (
              <AgentCard key={a.id} agent={a} onOpenSettings={setSelected}/>
            ))}
          </div>
        )}
        {activeTab === 'automl' && (
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'60%',flexDirection:'column',gap:12}}>
            <div style={{fontSize:32,opacity:.2}}>⚗</div>
            <div style={{fontSize:13,color:'var(--text-3)'}}>AutoML agent configuration — coming soon</div>
            <div style={{fontSize:11,color:'var(--text-3)'}}>Model tournament settings, feature engineering config, and CV strategy</div>
          </div>
        )}
        {activeTab === 'governance' && (
          <div style={{maxWidth:820,margin:'0 auto',display:'flex',flexDirection:'column',gap:12}}>
            <div style={{background:'var(--card)',border:'1px solid var(--border-s)',borderRadius:10,padding:'16px 20px'}}>
              <div style={{fontSize:9.5,fontWeight:700,letterSpacing:'.1em',textTransform:'uppercase',color:'var(--text-3)',marginBottom:8}}>Governance Agent Assessment — Q3-2026 Cycle</div>
              <div style={{fontSize:13,color:'var(--text-2)',lineHeight:1.7}}>
                All 9 S&OP agents have been evaluated by the Governance Agent for prompt quality, output relevance, specification coverage, and usefulness to the planning cycle. 4 agents exceed the performance threshold; 4 have prompts flagged for revision to improve specificity or output structure.
              </div>
            </div>
            {AGENTS.map(a => (
              <div key={a.id} style={{background:'var(--card)',border:'1px solid var(--border-s)',borderRadius:8,padding:'12px 16px',display:'flex',alignItems:'center',gap:12}}>
                <AgentIcon color={a.color} status="running" size={32}/>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:600,color:a.color}}>{a.name}</div>
                  <div style={{fontSize:11,color:'var(--text-3)',marginTop:2}}>{a.sub}</div>
                </div>
                <div style={{display:'flex',gap:6,alignItems:'center'}}>
                  <span className={`eval-badge ${a.promptEval.verdict==='Exceeds'?'eval-exceeds':'eval-meets'}`}>{a.promptEval.verdict}</span>
                  <span className={`eval-badge ${a.promptEval.revision==='No Revision Needed'?'eval-no-rev':'eval-revision'}`}>{a.promptEval.revision}</span>
                </div>
                <button className="ac-setting-btn" style={{margin:0,width:'auto',padding:'6px 14px',fontSize:11}}
                  onClick={()=>setSelected(a)}>⚙ Settings</button>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Settings drawer */}
      {selected && (
        <SettingsDrawer
          agent={{...selected, ...(configs[selected.id]||{})}}
          onClose={()=>setSelected(null)}
          onSave={handleSave}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
