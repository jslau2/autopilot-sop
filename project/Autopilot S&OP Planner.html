<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Autopilot S&OP — Production Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@1,400;1,500;1,600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
/* ─── Variables ───────────────────────────────────────────── */
:root {
  --bg-base:       oklch(0.09 0.007 245);
  --bg-surface:    oklch(0.12 0.006 245);
  --bg-card:       oklch(0.155 0.005 245);
  --bg-card-h:     oklch(0.185 0.005 245);
  --bg-input:      oklch(0.13 0.006 245);
  --border:        oklch(0.32 0.008 245);
  --border-subtle: oklch(0.24 0.007 245);
  --text-1:        oklch(0.92 0.005 235);
  --text-2:        oklch(0.58 0.008 245);
  --text-3:        oklch(0.38 0.007 245);
  --accent:        oklch(0.72 0.17 162);
  --danger:        oklch(0.65 0.20 25);
  --success:       oklch(0.74 0.18 145);
  --warning:       oklch(0.80 0.18 78);

  /* S&OP Agent palette */
  --ag-planner:   oklch(0.80 0.16 78);
  --ag-demand:    oklch(0.68 0.17 255);
  --ag-spi:       oklch(0.74 0.15 190);
  --ag-capacity:  oklch(0.72 0.17 148);
  --ag-wip:       oklch(0.70 0.20 308);
  --ag-finance:   oklch(0.73 0.19 48);
  --ag-risk:      oklch(0.70 0.21 15);
  --ag-inventory: oklch(0.72 0.18 325);
  --ag-masterdata: oklch(0.74 0.14 235);
  --ag-procurement:oklch(0.73 0.16 276);
  --ag-optimizer:  oklch(0.77 0.19 110);
  --ag-tooling:   oklch(0.70 0.17 55);

  --font-ui:    'DM Sans', system-ui, sans-serif;
  --font-mono:  'JetBrains Mono', monospace;
  --font-serif: 'Playfair Display', Georgia, serif;

  --sidebar-w:   244px;
  --drawer-w:    420px;
  --toolbar-h:   46px;
  --kpibar-h:    52px;
  --eventbar-h:  160px;
  --radius:      7px;
}

/* ─── Reset ───────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: var(--font-ui); font-size: 13px; background: var(--bg-base); color: var(--text-1); -webkit-font-smoothing: antialiased; }
.mono { font-family: var(--font-mono); }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
kbd { display: inline-block; padding: 1px 5px; border: 1px solid var(--border); border-radius: 3px; font-family: var(--font-mono); font-size: 10px; color: var(--text-3); background: var(--bg-surface); }

/* ─── Shell ───────────────────────────────────────────────── */
.app { display: flex; height: 100vh; overflow: hidden; }
.main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

/* ─── Sidebar ─────────────────────────────────────────────── */
.sidebar { width: var(--sidebar-w); flex-shrink: 0; background: var(--bg-surface); border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column; overflow: hidden; }
.sidebar-brand { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--border-subtle); }
.brand-icon { opacity: 0.9; flex-shrink: 0; }
.brand-name { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
.brand-tag { font-size: 9px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-3); border: 1px solid var(--border); padding: 1px 5px; border-radius: 3px; margin-left: auto; }
.sb-section { padding: 12px 14px; border-bottom: 1px solid var(--border-subtle); }
.sb-sessions { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
.sb-label { font-size: 9.5px; font-weight: 600; letter-spacing: 0.1em; color: var(--text-3); margin-bottom: 8px; }
.project-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
.project-item { display: flex; align-items: center; gap: 7px; padding: 5px 7px; border-radius: 5px; cursor: pointer; font-size: 12.5px; color: var(--text-2); transition: background 0.15s; }
.project-item:hover { background: var(--bg-card); }
.project-item.is-active { color: var(--text-1); background: var(--bg-card); }
.project-bullet { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.project-active-pill { margin-left: auto; font-size: 9px; letter-spacing: 0.05em; color: var(--accent); border: 1px solid var(--accent); padding: 1px 5px; border-radius: 3px; opacity: 0.8; }
.sb-ghost-btn { font-size: 11.5px; color: var(--text-3); padding: 4px 2px; margin-top: 2px; width: 100%; text-align: left; transition: color 0.15s; }
.sb-ghost-btn:hover { color: var(--text-2); }
.drop-zone { border: 1px dashed var(--border); border-radius: var(--radius); padding: 12px; text-align: center; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
.drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent); background: oklch(from var(--accent) l c h / 0.06); }
.dz-icon { font-size: 16px; color: var(--text-3); margin-bottom: 4px; }
.dz-hint { font-size: 11px; color: var(--text-3); margin-bottom: 6px; }
.dz-current { display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 11.5px; color: var(--text-2); font-weight: 500; }
.dz-file-dot { width: 5px; height: 5px; background: var(--success); border-radius: 50%; }
.dz-stats { font-size: 10.5px; color: var(--text-3); margin-top: 2px; font-family: var(--font-mono); }
.session-list { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; margin-bottom: 6px; }
.session-item { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 5px; cursor: pointer; transition: background 0.15s; }
.session-item:hover { background: var(--bg-card); }
.session-item.is-active { background: var(--bg-card); }
.sess-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.sess-running { background: var(--success); box-shadow: 0 0 6px var(--success); animation: sess-pulse 2s ease-in-out infinite; }
.sess-done { background: var(--text-3); }
@keyframes sess-pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
.sess-body { min-width: 0; }
.sess-name { font-size: 12px; color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sess-time { font-size: 10.5px; color: var(--text-3); }
.sidebar-footer { padding: 10px 16px; border-top: 1px solid var(--border-subtle); }
.footer-hint { font-size: 10.5px; color: var(--text-3); }

/* ─── Toolbar ─────────────────────────────────────────────── */
.main-toolbar { height: var(--toolbar-h); display: flex; align-items: center; padding: 0 16px; gap: 12px; border-bottom: 1px solid var(--border-subtle); background: var(--bg-surface); flex-shrink: 0; }
.toolbar-goal { flex: 1; min-width: 0; overflow: hidden; }
.goal-text { font-family: var(--font-ui); font-size: 13px; font-weight: 500; color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
.toolbar-right { display: flex; align-items: center; gap: 8px; }
.view-btn { font-size: 12px; color: var(--text-2); padding: 4px 10px; border-radius: 5px; border: 1px solid transparent; transition: all 0.15s; }
.view-btn:hover { background: var(--bg-card); color: var(--text-1); }
.view-btn.is-active { background: var(--bg-card); border-color: var(--border); color: var(--text-1); }
.key-hint { font-family: var(--font-mono); font-size: 9px; color: var(--text-3); border: 1px solid var(--border); padding: 1px 4px; border-radius: 3px; margin-left: 4px; }
.status-pill { font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 12px; }
.status-pill.sp-running { color: var(--success); background: oklch(from var(--success) l c h / 0.12); }
.status-pill.sp-paused  { color: var(--warning); background: oklch(from var(--warning) l c h / 0.12); animation: sp-blink 1.2s ease-in-out infinite; }
.status-pill.sp-done    { color: var(--text-2); background: var(--bg-card); }
@keyframes sp-blink { 0%,100%{opacity:1} 50%{opacity:0.6} }
.elapsed-time { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); min-width: 38px; text-align: right; }

/* ─── KPI bar ─────────────────────────────────────────────── */
.kpi-bar { height: var(--kpibar-h); flex-shrink: 0; background: var(--bg-base); border-bottom: 1px solid var(--border-subtle); display: flex; align-items: stretch; }
.kpi-cell { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-right: 1px solid var(--border-subtle); padding: 0 8px; }
.kpi-cell:last-child { border-right: none; }
.kpi-lbl { font-size: 8.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); }
.kpi-val { font-family: var(--font-mono); font-size: 17px; font-weight: 500; color: var(--text-1); line-height: 1; }
.kpi-val.kpi-computing { font-size: 11px; color: var(--text-3); font-style: italic; font-family: var(--font-ui); }
.kpi-val.kpi-good  { color: var(--success); }
.kpi-val.kpi-warn  { color: var(--warning); }
.kpi-val.kpi-bad   { color: var(--danger); }
.kpi-sub { font-size: 9px; color: var(--text-3); }

/* ─── Graph area ──────────────────────────────────────────── */
.main-graph { flex: 1; overflow: hidden; display: flex; flex-direction: column; background: var(--bg-base); }

/* ─── Swimlane ────────────────────────────────────────────── */
.swimlane-root { display: flex; flex: 1; overflow: hidden; height: 100%; }
.swim-labels { flex-shrink: 0; background: var(--bg-surface); border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column; z-index: 2; }
.agent-label-row { display: flex; align-items: center; gap: 8px; padding: 0 10px 0 0; border-bottom: 1px solid var(--border-subtle); overflow: hidden; }
.agent-color-bar { width: 3px; align-self: stretch; flex-shrink: 0; border-radius: 0 2px 2px 0; }
.agent-label-text { min-width: 0; padding: 6px 0; }
.agent-label-name { display: block; font-size: 12px; font-weight: 500; white-space: nowrap; }
.agent-label-sub  { display: block; font-size: 10px; color: var(--text-3); margin-top: 1px; }
.swim-scroll { flex: 1; overflow-x: auto; overflow-y: auto; }
.swim-inner  { position: relative; display: flex; flex-direction: column; }
.swim-ruler  { position: sticky; top: 0; z-index: 3; background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle); flex-shrink: 0; }
.ruler-tick  { position: absolute; top: 0; height: 100%; display: flex; align-items: flex-end; padding-bottom: 5px; }
.ruler-tick::before { content:''; position: absolute; top: 0; left: 0; width: 1px; height: 6px; background: var(--border); }
.ruler-label { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-3); margin-left: 3px; user-select: none; }
.playhead { position: absolute; top: 0; width: 1px; height: 100%; background: var(--accent); opacity: 0.7; pointer-events: none; }
.swim-lane { position: relative; border-bottom: 1px solid var(--border-subtle); flex-shrink: 0; }
.lane-grid  { position: absolute; top: 0; width: 1px; height: 100%; background: var(--border-subtle); opacity: 0.35; pointer-events: none; }
.step-card  { position: absolute; border-radius: 5px; border: 1px solid var(--border-subtle); border-left: 3px solid var(--ac, var(--border)); background: var(--bg-card); cursor: pointer; overflow: hidden; display: flex; align-items: stretch; transition: background 0.15s; user-select: none; }
.step-card:hover { background: var(--bg-card-h); }
.step-card.sc-selected { border-color: var(--ac) !important; box-shadow: 0 0 0 1px var(--ac) inset; }
.step-card.sc-running { animation: card-glow 2.2s ease-in-out infinite; }
@keyframes card-glow { 0%,100%{ box-shadow: 0 0 8px color-mix(in oklch, var(--ac) 20%, transparent); } 50%{ box-shadow: 0 0 0 1px color-mix(in oklch, var(--ac) 50%, transparent), 0 0 22px color-mix(in oklch, var(--ac) 35%, transparent); } }
.step-card.sc-paused { border-left-color: var(--warning) !important; animation: card-pulse 1.3s ease-in-out infinite; }
@keyframes card-pulse { 0%,100%{opacity:1} 50%{opacity:0.65} }
.step-card.sc-done { opacity: 0.82; }
.sc-body { flex: 1; padding: 5px 8px; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.sc-label  { font-size: 11px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-1); }
.sc-metrics { display: flex; gap: 4px; overflow: hidden; }
.sc-chip   { font-family: var(--font-mono); font-size: 9px; color: var(--text-2); background: var(--bg-surface); padding: 1px 4px; border-radius: 3px; white-space: nowrap; }
.sc-tokens { font-family: var(--font-mono); font-size: 9px; color: var(--text-3); }
.sc-pause-icon { width: 18px; align-self: center; text-align: center; font-size: 13px; font-weight: 700; color: var(--warning); flex-shrink: 0; margin-right: 4px; }
.sc-spin { width: 8px; height: 8px; border: 1.5px solid color-mix(in oklch, var(--ac) 30%, transparent); border-top-color: var(--ac); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; align-self: center; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.connectors-svg { position: absolute; left: 0; width: 100%; pointer-events: none; z-index: 1; overflow: visible; }
.time-cursor { position: absolute; top: 0; width: 1px; background: var(--accent); opacity: 0.5; pointer-events: none; z-index: 2; }

/* ─── Timeline view ───────────────────────────────────────── */
.tl-root  { flex: 1; overflow-y: auto; padding: 24px 32px; position: relative; }
.tl-track { position: absolute; left: 65px; top: 24px; bottom: 24px; width: 1px; background: var(--border-subtle); }
.tl-items { display: flex; flex-direction: column; }
.tl-item  { display: flex; gap: 14px; padding: 10px 0; cursor: pointer; }
.tl-item:hover .tl-content { background: var(--bg-surface); }
.tl-item.tl-selected .tl-content { background: var(--bg-card); border-color: var(--border); }
.tl-node-wrap  { display: flex; flex-direction: column; align-items: center; width: 80px; flex-shrink: 0; padding-top: 12px; position: relative; }
.tl-node       { width: 20px; height: 20px; border-radius: 50%; border: 2px solid; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; flex-shrink: 0; }
.tl-node-pulse { position: absolute; inset: -5px; border-radius: 50%; opacity: 0.3; animation: tl-pulse 2s ease-in-out infinite; }
@keyframes tl-pulse { 0%,100%{transform:scale(1);opacity:0.3} 50%{transform:scale(1.6);opacity:0} }
.tl-node-check, .tl-node-q { font-size: 9px; font-weight: 700; color: var(--bg-base); }
.tl-connector-line { flex: 1; width: 1px; background: var(--border-subtle); min-height: 20px; }
.tl-content { flex: 1; min-width: 0; border: 1px solid transparent; border-radius: var(--radius); padding: 10px 14px; transition: background 0.15s, border-color 0.15s; }
.tl-row1 { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
.tl-agent-pill { font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 10px; border: 1px solid; flex-shrink: 0; }
.tl-label { font-size: 13px; font-weight: 500; color: var(--text-1); }
.tl-status-badge { margin-left: auto; font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
.tl-badge-running { background: oklch(from var(--success) l c h / 0.14); color: var(--success); }
.tl-badge-done    { background: var(--bg-surface); color: var(--text-3); }
.tl-badge-paused  { background: oklch(from var(--warning) l c h / 0.14); color: var(--warning); }
.tl-row2 { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.tl-time-val, .tl-dur, .tl-tok { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); }
.tl-metrics { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.tl-metric-chip { display: flex; gap: 4px; background: var(--bg-base); border: 1px solid var(--border-subtle); border-radius: 4px; padding: 2px 7px; font-size: 10.5px; }
.tl-metric-k { color: var(--text-3); } .tl-metric-v { color: var(--text-1); }
.tl-question-preview { display: flex; align-items: flex-start; gap: 6px; margin-top: 6px; padding: 6px 8px; background: oklch(from var(--warning) l c h / 0.08); border-left: 2px solid var(--warning); border-radius: 0 4px 4px 0; }
.tl-q-icon { font-size: 11px; color: var(--warning); flex-shrink: 0; margin-top: 1px; }
.tl-q-text { font-family: var(--font-ui); font-size: 11.5px; color: var(--text-2); }
.tl-empty  { padding: 40px; text-align: center; color: var(--text-3); font-size: 12px; }

/* ─── Event bar ───────────────────────────────────────────── */
.event-bar { height: var(--eventbar-h); flex-shrink: 0; border-top: 1px solid var(--border-subtle); background: var(--bg-surface); display: flex; flex-direction: column; }
.event-bar-hd { display: flex; align-items: center; gap: 10px; padding: 6px 14px; border-bottom: 1px solid var(--border-subtle); flex-shrink: 0; }
.evb-title { font-size: 10.5px; font-weight: 600; letter-spacing: 0.05em; color: var(--text-3); text-transform: uppercase; }
.evb-count { font-family: var(--font-mono); font-size: 10px; color: var(--text-3); }
.evb-live  { display: flex; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 600; letter-spacing: 0.08em; color: var(--success); margin-left: auto; }
.live-dot  { width: 6px; height: 6px; background: var(--success); border-radius: 50%; animation: live-blink 1.5s ease-in-out infinite; }
@keyframes live-blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
.evb-done  { margin-left: auto; font-size: 9.5px; font-weight: 600; letter-spacing: 0.08em; color: var(--text-3); }
.event-list { flex: 1; overflow-y: auto; padding: 4px 0; }
.evt-row { display: flex; align-items: baseline; gap: 8px; padding: 3px 14px; transition: background 0.1s; }
.evt-row:hover { background: var(--bg-card); }
.evt-question { background: oklch(from var(--warning) l c h / 0.06); }
.evt-answer   { background: oklch(from var(--accent) l c h / 0.05); }
.evt-ts    { font-family: var(--font-mono); font-size: 10px; color: var(--text-3); flex-shrink: 0; min-width: 90px; }
.evt-icon  { font-size: 10px; flex-shrink: 0; min-width: 12px; }
.evt-icon-start    { color: var(--accent); }
.evt-icon-done     { color: var(--success); }
.evt-icon-question { color: var(--warning); }
.evt-icon-answer   { color: var(--accent); }
.evt-icon-log      { color: var(--text-3); }
.evt-agent { font-size: 10.5px; font-weight: 500; flex-shrink: 0; min-width: 100px; }
.evt-agent-user { color: var(--text-2); }
.evt-msg   { color: var(--text-2); font-size: 11.5px; }
.evt-empty { padding: 20px 14px; color: var(--text-3); }

/* ─── Drawer ──────────────────────────────────────────────── */
.drawer-overlay { position: fixed; inset: 0; background: oklch(0 0 0 / 0.4); z-index: 100; display: flex; justify-content: flex-end; animation: overlay-in 0.2s ease; }
@keyframes overlay-in { from{opacity:0} to{opacity:1} }
.drawer { width: var(--drawer-w); height: 100%; background: var(--bg-surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; animation: drawer-in 0.25s cubic-bezier(0.4,0,0.2,1); overflow: hidden; }
@keyframes drawer-in { from{transform:translateX(100%)} to{transform:translateX(0)} }
.drawer-header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid; flex-shrink: 0; }
.drawer-agent-pill { font-size: 10.5px; font-weight: 500; padding: 3px 9px; border-radius: 10px; border: 1px solid; flex-shrink: 0; }
.drawer-title { font-size: 14px; font-weight: 600; color: var(--text-1); flex: 1; min-width: 0; }
.drawer-close { width: 26px; height: 26px; border-radius: 50%; background: var(--bg-card); color: var(--text-2); font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.15s; }
.drawer-close:hover { background: var(--bg-card-h); }
.drawer-meta { display: flex; flex-wrap: wrap; gap: 1px; padding: 10px 16px; border-bottom: 1px solid var(--border-subtle); flex-shrink: 0; }
.meta-cell { display: flex; flex-direction: column; gap: 2px; padding: 6px 12px 6px 0; min-width: 80px; }
.meta-cell-label { font-size: 9.5px; color: var(--text-3); letter-spacing: 0.05em; text-transform: uppercase; }
.meta-cell-val   { font-size: 12px; color: var(--text-1); }

function nowTs() {
  const d = new Date();
  return d.toTimeString().slice(0,8) + '.' + String(d.getMilliseconds()).padStart(3,'0');
}
function startStep(S, def) {
  S.steps[def.id] = { status:'running', startT:S.elapsedT, endT:null, records:0, metrics:null, output:null, question:null, type:'task', ...def };
  S.events.push({ ts:nowTs(), type:'start', agent:def.agent, message:`▶ ${def.label}`, stepId:def.id });
}
function completeStep(S, id, patch, msg) {
  const s = S.steps[id]; if (!s) return;
  Object.assign(s, { status:'done', endT:S.elapsedT, ...patch });
  S.events.push({ ts:nowTs(), type:'done', agent:s.agent, message:`✓ ${msg}`, stepId:id });
}
function addLog(S, agent, message) {
  S.events.push({ ts:nowTs(), type:'log', agent, message, stepId:null });
}
function pauseForQuestion(S, id, agent, label, deps, qtext) {
  S.steps[id] = { id, agent, label, deps, status:'paused', type:'question', startT:S.elapsedT, endT:null, records:0, metrics:null, output:null, question:{ text:qtext } };

/* ═══ KPI bar component ══════════════════════════════════════ */
function KPIBar({ kpis }) {
  const cells = [
    { lbl:'OTIF Forecast',     val: kpis.otif,          good: kpis.otif === '97.8%',  sub:'target ≥ 98%'    },
    { lbl:'Forecast Accuracy', val: kpis.forecastAcc,   good: true,                   sub:'MAPE at SKU×wk'  },
    { lbl:'Capacity Util.',    val: kpis.capacityUtil,   warn: kpis.capacityUtil==='87%', sub:'avg all lines' },
    { lbl:'Weeks of Supply',   val: kpis.wos ? kpis.wos+' wk' : null, good: true,    sub:'target 4–5 wk'   },
    { lbl:'Plan Δ EBIT',       val: kpis.planDelta != null ? `+$${kpis.planDelta}k` : null, good: kpis.planDelta > 0, sub:'vs unconstrained' },
  ];
  return (
    <div className="kpi-bar">
      {cells.map((c, i) => (
        <div key={i} className="kpi-cell">
          <span className="kpi-lbl">{c.lbl}</span>
          <span className={`kpi-val${!c.val ? ' kpi-computing' : c.good ? ' kpi-good' : c.warn ? ' kpi-warn' : c.bad ? ' kpi-bad' : ''}`}>
            {c.val ?? '—'}
          </span>
          <span className="kpi-sub">{c.sub}</span>
        </div>
      ))}
    </div>
  );
}

function TourOverlay({ onClose }) {
  const [step, setStep]   = useState(0);
  const [rect, setRect]   = useState(null);
  const tipRef = useRef(null);

  useEffect(() => {
    const s = TOUR_STEPS[step];
    if (!s.sel) { setRect(null); return; }
    const el = document.querySelector(s.sel);
    if (!el) { setRect(null); return; }
    const r = el.getBoundingClientRect();
    setRect({ top: r.top, left: r.left, w: r.width, h: r.height });
  }, [step]);

  const cur = TOUR_STEPS[step];
  const total = TOUR_STEPS.length;
  const next = () => step < total - 1 ? setStep(s => s + 1) : onClose();
  const back = () => step > 0 && setStep(s => s - 1);

  // Position tooltip
  const tipStyle = (() => {
    const TW = 310, PAD = 14;
    if (!rect || cur.pos === 'center') {
      return { position:'fixed', top:'50%', left:'50%', transform:'translate(-50%,-50%)' };
    }
    const WW = window.innerWidth, WH = window.innerHeight;
    const safeLeft = (x) => Math.max(PAD, Math.min(WW - TW - PAD, x));
    if (cur.pos === 'bottom') return { position:'fixed', top: rect.top + rect.h + 16, left: safeLeft(rect.left + rect.w/2 - TW/2) };
    if (cur.pos === 'top')    return { position:'fixed', bottom: WH - rect.top + 16,  left: safeLeft(rect.left + rect.w/2 - TW/2) };
    if (cur.pos === 'right')  return { position:'fixed', top: Math.max(PAD, rect.top + rect.h/2 - 100), left: rect.left + rect.w + 16 };
    if (cur.pos === 'left')   return { position:'fixed', top: Math.max(PAD, rect.top + rect.h/2 - 100), right: WW - rect.left + 16 };
    return { position:'fixed', top:'50%', left:'50%', transform:'translate(-50%,-50%)' };
  })();

  return (
    <>
      <div className="tour-backdrop" onClick={onClose} />
      {rect && (
        <div className="tour-spot" style={{ top: rect.top - 5, left: rect.left - 5, width: rect.w + 10, height: rect.h + 10 }} />
      )}
      <div className="tour-tip" style={tipStyle} ref={tipRef}>
        <div className="tour-progress">
          {TOUR_STEPS.map((_, i) => <span key={i} className={`tour-dot${i === step ? ' active' : ''}`}/>)}
        </div>
        <div className="tour-tip-badge">Step {step + 1} of {total}</div>
        <div className="tour-tip-title">{cur.title}</div>
        <p className="tour-tip-desc">{cur.desc}</p>
        <div className="tour-controls">
          <button className="tour-skip" onClick={onClose}>Skip tour</button>
          <span className="tour-spacer"/>
          {step > 0 && <button className="tour-back" onClick={back}>← Back</button>}
          <button className="tour-next" onClick={next}>{step === total - 1 ? '✓ Done' : 'Next →'}</button>
        </div>
      </div>
    </>
  );
}

/* ═══ Question modal ═════════════════════════════════════════ */
function QuestionModal({ question, onAnswer, onTerminate }) {
  const [text, setText] = useState('');
  const submit = (e) => { e.preventDefault(); if (!text.trim()) return; onAnswer(text.trim()); setText(''); };
  return (
    <div className="q-overlay">
      <div className="q-modal">
        <div className="qm-header">
          <span className="qm-agent-name">Planner</span>
          <span className="qm-paused-badge">⏸ Decision Required</span>
        </div>
        <div className="qm-body">
          <p className="qm-question-text">{question.text}</p>
          <form className="qm-form" onSubmit={submit}>
            <textarea className="qm-textarea" value={text} onChange={e=>setText(e.target.value)} placeholder="State your decision (e.g. Option A — approve overtime)…" autoFocus />
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <button type="button" onClick={onTerminate}
                style={{fontSize:11.5,fontWeight:500,color:'var(--danger)',background:'oklch(from var(--danger) l c h/.1)',border:'1px solid oklch(from var(--danger) l c h/.3)',padding:'6px 12px',borderRadius:6,cursor:'pointer'}}>
                ⛔ Terminate session
              </button>
              <span style={{flex:1}}/>
              <button type="submit" className="qm-submit" disabled={!text.trim()}>Confirm Decision →</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  );
}

/* ═══ Tweak defaults ═════════════════════════════════════════ */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "speed": 0.5,
  "density": "compact",
  "showConnectors": true,
  "showMetrics": true,
  "timeScale": 60
}/*EDITMODE-END*/;

/* ═══ App ════════════════════════════════════════════════════ */
function App() {
  const [tick,            setTick]           = useState(0);
  const [selectedStepId,  setSelectedStepId]  = useState(null);
  const [viewMode,        setViewMode]        = useState('swimlane');
  const [activeSessionId, setActiveSessionId] = useState('sess-001');
  const [showConfig,      setShowConfig]      = useState(false);
  const [showTour,        setShowTour]        = useState(() => !localStorage.getItem('sop-tour-done'));
  const closeTour = () => { localStorage.setItem('sop-tour-done','1'); setShowTour(false); };

  const { TweaksPanel, useTweaks, TweakSection, TweakRadio, TweakToggle, TweakSlider } = window;
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const S = useRef({
    steps:{}, events:[], elapsedT:0, postQ1T:0,
    paused:false, manualPaused:false, postQ1Mode:false, pendingQuestion:null,
    processed:new Set(), sessionStatus:'running', done:false,
    kpis:{ otif:null, forecastAcc:null, capacityUtil:null, wos:null, planDelta:null },
  }).current;

  const speedRef = useRef(tweaks.speed);
  useEffect(() => { speedRef.current = tweaks.speed; }, [tweaks.speed]);

  /* RAF simulation loop */
  useEffect(() => {
    let last = performance.now(), frame = 0, rafId;
    const tick = (now) => {
      const dt = Math.min((now - last) / 1000, 0.1) * speedRef.current;
      last = now;
      if (!S.done && !S.paused && !S.manualPaused) {
        S.elapsedT += dt;
        const queue = S.postQ1Mode ? POST_Q1 : PRE_Q1;
        queue.forEach((evt, i) => {
          const key = (S.postQ1Mode ? 'p_' : 'q_') + i;
          const t = S.postQ1Mode ? S.postQ1T : S.elapsedT;
          if (!S.processed.has(key) && evt.at <= t) { S.processed.add(key); evt.act(S); }
        });
        if (S.postQ1Mode) S.postQ1T += dt;
        if (S.sessionStatus === 'done') S.done = true;
      }
      frame++;
      if (frame % 3 === 0) setTick(t => t + 1);
      rafId = requestAnimationFrame(tick);
    };
    rafId = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafId);
  }, []);

  /* Keyboard shortcuts */
  useEffect(() => {
    const handler = (e) => {
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
      if (e.key === 't' || e.key === 'T') setViewMode(v => v === 'swimlane' ? 'timeline' : 'swimlane');
      if (e.key === 'Escape') setSelectedStepId(null);
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  const terminateSession = useCallback(() => {
    S.paused = false;
    S.done = true;
    S.pendingQuestion = null;
    S.sessionStatus = 'done';
    S.events.push({ ts: nowTs(), type:'log', agent:'user', message:'⛔ Session terminated by user' });
    setTick(t => t + 1);
  }, []);

  const answerQuestion = useCallback((answer) => {
    const { stepId } = S.pendingQuestion;
    if (S.steps[stepId]) { S.steps[stepId].output = { answer }; S.steps[stepId].status='done'; S.steps[stepId].endT=S.elapsedT; }
    S.events.push({ ts:nowTs(), type:'answer', agent:'user', message:`↳ Decision: "${answer.slice(0,80)}${answer.length>80?'…':''}"`, stepId });
    S.pendingQuestion=null; S.paused=false; S.postQ1Mode=true; S.postQ1T=0;
    setTick(t => t+1);
  }, []);

  const stepsArr = Object.values(S.steps);
  const pxPerSec = tweaks.timeScale || 55;
  const statusLabel = S.sessionStatus==='done' ? 'Complete'
    : S.paused ? '⏸ Decision Required'
    : S.manualPaused ? '⏸ Paused'
    : '● Running';
  const statusClass = S.sessionStatus==='done' ? 'sp-done'
    : (S.paused || S.manualPaused) ? 'sp-paused'
    : 'sp-running';

  const ctxValue = {
    steps:S.steps, stepsArr, events:S.events, elapsedT:S.elapsedT,
    pendingQuestion:S.pendingQuestion, sessionStatus:S.sessionStatus,
    selectedStepId, setSelectedStepId,
    viewMode, setViewMode,
    activeSessionId, setActiveSessionId,
    tweaks, setTweak, answerQuestion, setShowTour,
  };

  return (
    <DashboardContext.Provider value={ctxValue}>
      <div className="app">
        <Sidebar />
        <div className="main-area">

          {/* Toolbar */}
          <div className="main-toolbar">
            <div className="toolbar-goal">
              <em className="goal-text">Q3-2026 S&OP · APAC Manufacturing · OTIF ≥ 98% · Margin ≥ 22% · 847 SKUs</em>
            </div>
            <div className="toolbar-right">
              <button className={`view-btn${viewMode==='swimlane'?' is-active':''}`} onClick={()=>setViewMode('swimlane')}>Swimlane</button>
              <button className={`view-btn${viewMode==='timeline'?' is-active':''}`} onClick={()=>setViewMode('timeline')}>Timeline <span className="key-hint">T</span></button>
              {!S.done && !S.paused && (
                <button className="view-btn" onClick={()=>{ S.manualPaused=!S.manualPaused; setTick(t=>t+1); }}
                  style={{color: S.manualPaused ? 'var(--success)' : 'var(--text-2)'}}>
                  {S.manualPaused ? '▶ Resume' : '⏸ Pause'}
                </button>
              )}
              <a href="S&OP Agent Console.html" className="cfg-toolbar-btn" style={{textDecoration:'none'}}>⊞ Agent Console</a>
              <a href="S&OP Agent Settings.html" className="cfg-toolbar-btn" style={{textDecoration:'none'}}>⚙ Agent Settings</a>
              <a href="S&OP Agent Manager.html" className="cfg-toolbar-btn" style={{textDecoration:'none'}}>📊 Agent Manager</a>
              <a href="index.html" className="cfg-toolbar-btn" style={{textDecoration:'none'}}>⌂ Home</a>
              <button className="cfg-toolbar-btn" onClick={()=>setShowConfig(true)}>⚙ Capacity Config</button>
              <button className="tour-help-btn" onClick={()=>setShowTour(true)}
                style={{width:'auto',padding:'4px 10px',borderRadius:5,fontSize:11,display:'flex',alignItems:'center',gap:4,whiteSpace:'nowrap'}}>
                ↺ Tour
              </button>
              <div className={`status-pill ${statusClass}`}>{statusLabel}</div>
              <span className="elapsed-time mono">{S.elapsedT.toFixed(1)}s</span>
            </div>
          </div>

          {/* KPI bar */}
          <KPIBar kpis={S.kpis} />

          {/* Graph */}
          <div className="main-graph">
            {viewMode === 'swimlane'
              ? <SwimlaneGraph pxPerSec={pxPerSec} density={tweaks.density} />
              : <LinearTimeline />}
          </div>

          {/* Event stream */}
          <EventStreamBar />
        </div>

        {selectedStepId && <DetailDrawer stepId={selectedStepId} onClose={()=>setSelectedStepId(null)} />}
        {S.pendingQuestion && <QuestionModal question={S.pendingQuestion} onAnswer={answerQuestion} onTerminate={terminateSession} />}
        {showConfig && <ConfigModal onClose={()=>setShowConfig(false)} />}
        {showTour   && <TourOverlay onClose={closeTour} />}

        <TweaksPanel>
          <TweakSection label="Playback" />
          <TweakRadio label="Speed" value={String(tweaks.speed)} options={['0.5','1','1.5','2','4']} onChange={v=>setTweak('speed',Number(v))} />
          <TweakSection label="Display" />
          <TweakRadio label="Density" value={tweaks.density} options={['compact','normal','spacious']} onChange={v=>setTweak('density',v)} />
          <TweakSlider label="Time scale" value={tweaks.timeScale} min={30} max={120} step={10} unit="px/s" onChange={v=>setTweak('timeScale',v)} />
          <TweakToggle label="Connectors" value={tweaks.showConnectors} onChange={v=>setTweak('showConnectors',v)} />
          <TweakToggle label="Inline metrics" value={tweaks.showMetrics} onChange={v=>setTweak('showMetrics',v)} />
        </TweaksPanel>
      </div>
    </DashboardContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
